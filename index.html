<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRAINING CONTROL — вход</title><style>:root{--bg:#FFFFFF;--card:#FFFFFF;--line:#E4EBF4;--txt:#07152F;--mut:#52647D;--blue:#087BFF;--blue-strong:#006FE8;--blue-soft:#EAF4FF;--red:#F04452}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}.box{width:min(410px,calc(100% - 28px));padding:32px 30px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 12px 36px rgba(20,60,110,.08);text-align:center}.mark{width:54px;height:54px;margin:0 auto 16px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue);font-size:26px;font-weight:900}.title{font-size:30px;line-height:1.05;font-weight:900;letter-spacing:-.025em;margin:0}.subtitle{font-size:14px;color:var(--mut);margin-top:7px}.divider{height:1px;background:var(--line);margin:24px 0 20px}.label{display:block;text-align:left;font-size:12px;font-weight:800;color:#64768E;margin-bottom:8px}.pin{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#F8FBFF;color:var(--txt);font-size:24px;font-weight:800;text-align:center;letter-spacing:.42em;outline:none;transition:.18s}.pin:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,123,255,.10);background:#fff}.btn{width:100%;margin-top:12px;padding:14px;border:1px solid var(--blue);border-radius:12px;background:var(--blue);color:#fff;font-size:15px;font-weight:900;cursor:pointer;transition:.18s}.btn:hover{background:var(--blue-strong);border-color:var(--blue-strong)}.err{height:20px;margin-top:10px;color:var(--red);font-size:12px}.note{font-size:11px;color:#8796AA;margin-top:12px}@media(max-width:480px){.box{padding:26px 20px}.title{font-size:28px}.subtitle{font-size:13px}}</style><link rel="icon" href="trainer-icon-32.png?v=4" sizes="32x32" type="image/png"><link rel="shortcut icon" href="trainer-icon-32.png?v=4" type="image/png"><link rel="manifest" href="manifest.webmanifest?v=4"><meta name="theme-color" content="#FFFFFF"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TRAINING CONTROL"><link rel="apple-touch-icon" sizes="180x180" href="trainer-icon-180.png?v=4"></head><body><main class="box"><div class="mark">TC</div><div class="title">TRAINING CONTROL</div><div class="subtitle">персональный центр спортивной формы</div><div class="divider"></div><form id="f"><label class="label" for="p">PIN-код</label><input id="p" class="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" autofocus><button class="btn">Открыть Dashboard</button><div id="e" class="err"></div></form><div class="note">Персональный доступ к спортивной аналитике</div></main><script>const f=document.getElementById('f'),p=document.getElementById('p'),e=document.getElementById('e');f.addEventListener('submit',x=>{x.preventDefault();if(p.value==='2112'){sessionStorage.setItem('trainer_access','1');location.href='dashboard-v15.html?v=5ae37ffb'}else{e.textContent='Неверный PIN';p.value='';p.focus()}});</script></body></html>
