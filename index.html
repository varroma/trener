<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренер — вход</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#10283b,#071522 40%,#05111b);color:#f5f8fb;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.box{width:min(390px,calc(100% - 32px));padding:30px;border:1px solid #244258;border-radius:18px;background:linear-gradient(180deg,#102536,#0a1b29);box-shadow:0 20px 60px #0008;text-align:center}.logo{font-size:12px;letter-spacing:.18em;color:#55dfa0;font-weight:900}.title{font-size:30px;font-weight:900;margin:12px 0 5px}.mut{color:#8fa6b7;margin-bottom:22px}.pin{width:100%;padding:15px 18px;border-radius:12px;border:1px solid #35566d;background:#071725;color:white;font-size:24px;text-align:center;letter-spacing:.5em;outline:none}.pin:focus{border-color:#55dfa0}.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#55dfa0;color:#052016;font-size:15px;font-weight:900;cursor:pointer}.err{height:20px;margin-top:10px;color:#ff7d7d}.note{font-size:11px;color:#627d90;margin-top:16px}</style><link rel="icon" href="trainer-icon-v2.jpg?v=20260923" type="image/jpeg"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f7fbff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Тренер"><link rel="apple-touch-icon" href="trainer-icon-v2.jpg?v=20260923"></head><body><main class="box"><div class="logo">TRAINER DASHBOARD</div><div class="title">Тренер</div><div class="mut">Введите 4-значный PIN</div><form id="f"><input id="p" class="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" autofocus><button class="btn">Открыть Dashboard</button><div id="e" class="err"></div></form><div class="note">Личный спортивный Dashboard</div></main><script>const f=document.getElementById('f'),p=document.getElementById('p'),e=document.getElementById('e');f.addEventListener('submit',x=>{x.preventDefault();if(p.value==='2112'){sessionStorage.setItem('trainer_access','1');location.href='dashboard.html'}else{e.textContent='Неверный PIN';p.value='';p.focus()}});</script></body></html>
